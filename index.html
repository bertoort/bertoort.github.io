<!DOCTYPE html>
<html lang="en">
<head>

  <title>berto</title>
  <meta name="description" content="Roberto Ortega — Software Engineer">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>
<body>
  <!-- SVG noise filter for fog texture -->
  <svg style="position:absolute;width:0;height:0">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </svg>

  <div id="glow" aria-hidden="true"></div>

  <!-- Revealed content (bright, under the fog) -->
  <main id="revealed">
    <div class="content">
      <h1>Roberto Ortega</h1>
      <p>Agent Prompter</p>
      <nav id="revealed-nav">
        <a href="#" class="link-item email-link" data-email="berto.ort@gmail.com" aria-label="Email">

  </main>

  <!-- Ghost (Gastly-inspired) -->
  <div id="ghost" aria-hidden="true">
    <svg viewBox="0 0 100 100" width="64" height="64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Gas cloud behind the sphere -->
      <ellipse cx="30" cy="38" rx="18" ry="14" fill="#9b6dcc" opacity="0.5">
        <animate attributeName="rx" values="18;22;18" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="14;16;14" dur="2.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="72" cy="42" rx="16" ry="13" fill="#9b6dcc" opacity="0.45">
        <animate attributeName="rx" values="16;20;16" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="13;15;13" dur="3.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="42" cy="68" rx="18" ry="11" fill="#8a5ec0" opacity="0.4">
        <animate attributeName="rx" values="18;21;18" dur="3.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="60" cy="26" rx="15" ry="12" fill="#8a5ec0" opacity="0.4">
        <animate attributeName="rx" values="15;19;15" dur="2.6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="25" cy="56" rx="13" ry="10" fill="#9b6dcc" opacity="0.35">
        <animate attributeName="ry" values="10;13;10" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="70" cy="60" rx="14" ry="10" fill="#8a5ec0" opacity="0.35">
        <animate attributeName="rx" values="14;17;14" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Dark sphere body -->
      <circle cx="50" cy="48" r="24" fill="#1a0a2e"/>
      <circle cx="50" cy="48" r="24" fill="url(#gastly-body)"/>
      <!-- Calm face -->
      <g class="face-calm">
        <!-- Left eye: slanted top (angry - high on outside, low on inside) -->
        <path d="M20 32 L50 40 A16 16 0 0 1 20 32 Z" fill="#fff"/>
        <!-- Right eye: mirrored -->
        <path d="M80 32 L50 40 A16 16 0 0 0 80 32 Z" fill="#fff"/>
        <!-- Pupils (JS moves these toward cursor) -->
        <circle id="pupil-l" cx="38" cy="39" r="3" fill="#111"/>
        <circle id="pupil-r" cx="62" cy="39" r="3" fill="#111"/>
        <!-- Mouth: wide grin with fangs -->
        <path d="M36 55 Q50 64 64 55" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M39 55 L38 59" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M61 55 L62 59" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <!-- Scared face -->
      <g class="face-scared">
        <!-- Big round worried eyes -->
        <circle cx="38" cy="38" r="10" fill="#fff"/>
        <circle cx="62" cy="38" r="10" fill="#fff"/>
        <!-- Tiny pupils (JS moves these toward cursor) -->
        <circle id="pupil-scared-l" cx="38" cy="38" r="2" fill="#111"/>
        <circle id="pupil-scared-r" cx="62" cy="38" r="2" fill="#111"/>
        <!-- Worried brow lines (angled up in the middle) -->
        <line x1="29" y1="26" x2="42" y2="29" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <line x1="71" y1="26" x2="58" y2="29" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <!-- Small wavy worried mouth -->
        <path d="M44 56 Q47 54 50 56 Q53 58 56 56" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
      <defs>
        <radialGradient id="gastly-body" cx="0.4" cy="0.35">
          <stop offset="0%" stop-color="#3a1a5e" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#0d0520" stop-opacity="1"/>
        </radialGradient>
      </defs>
    </svg>
  </div>

  <!-- Fog overlay -->
  <div id="overlay" aria-hidden="true"></div>

  <!-- CRT retro TV effect -->
  <div id="fog-texture" aria-hidden="true"></div>
  <div id="crt-scanlines" aria-hidden="true"></div>
  <div id="crt-vignette" aria-hidden="true"></div>

  <!-- Surface content (faint, above the fog).
       Identical structure to revealed so layout matches pixel-for-pixel. -->
  <main id="surface" aria-hidden="true">
    <div class="content">
      <h1><span id="ro-offset" class="hidden-text">Ro</span>berto<span class="hidden-text"> Ortega</span></h1>
      <p id="surface-title">software engineer</p>
      <nav id="surface-nav">
